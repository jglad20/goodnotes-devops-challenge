apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: http-echo-alerts
  namespace: monitoring
  labels:
    app: prometheus
    release: prometheus
spec:
  groups:
    # ============================================
    # APPLICATION HEALTH ALERTS
    # ============================================
    - name: http-echo-health
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) by (host)
              /
              sum(rate(nginx_ingress_controller_requests[5m])) by (host)
            ) > 0.05
          for: 2m
          labels:
            severity: warning
            component: http-echo
          annotations:
            summary: "High error rate detected for {{ $labels.host }}"
            description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.host }} (threshold: 5%)"

        - alert: CriticalErrorRate
          expr: |
            (
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) by (host)
              /
              sum(rate(nginx_ingress_controller_requests[5m])) by (host)
            ) > 0.20
          for: 1m
          labels:
            severity: critical
            component: http-echo
          annotations:
            summary: "CRITICAL: Very high error rate for {{ $labels.host }}"
            description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.host }} (threshold: 20%)"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{host=~"(foo|bar)\\.localhost"}[5m]))
              by (host, le)
            ) > 0.5
          for: 3m
          labels:
            severity: warning
            component: http-echo
          annotations:
            summary: "High latency detected for {{ $labels.host }}"
            description: "95th percentile latency is {{ $value }}s for {{ $labels.host }} (threshold: 0.5s)"

        - alert: PodNotReady
          expr: |
            kube_pod_status_phase{namespace="default", pod=~"(foo|bar)-echo-.*", phase!="Running"} == 1
          for: 2m
          labels:
            severity: warning
            component: http-echo
          annotations:
            summary: "Pod {{ $labels.pod }} is not running"
            description: "Pod {{ $labels.pod }} has been in {{ $labels.phase }} state for more than 2 minutes"

    # ============================================
    # RESOURCE UTILIZATION ALERTS
    # ============================================
    - name: http-echo-resources
      interval: 30s
      rules:
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="default", pod=~"(foo|bar)-echo-.*"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="default", pod=~"(foo|bar)-echo-.*", resource="cpu"}) by (pod)
            > 0.80
          for: 5m
          labels:
            severity: warning
            component: http-echo
          annotations:
            summary: "High CPU usage for {{ $labels.pod }}"
            description: "CPU usage is {{ $value | humanizePercentage }} of limit for {{ $labels.pod }}"

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="default", pod=~"(foo|bar)-echo-.*"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="default", pod=~"(foo|bar)-echo-.*", resource="memory"}) by (pod)
            > 0.80
          for: 5m
          labels:
            severity: warning
            component: http-echo
          annotations:
            summary: "High memory usage for {{ $labels.pod }}"
            description: "Memory usage is {{ $value | humanizePercentage }} of limit for {{ $labels.pod }}"

        - alert: PodRestartingFrequently
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="default", pod=~"(foo|bar)-echo-.*"}[15m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: http-echo
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

    # ============================================
    # INGRESS CONTROLLER ALERTS
    # ============================================
    - name: ingress-controller
      interval: 30s
      rules:
        - alert: IngressControllerDown
          expr: |
            up{job="ingress-nginx-controller-metrics"} == 0
          for: 1m
          labels:
            severity: critical
            component: ingress
          annotations:
            summary: "CRITICAL: Ingress controller is down"
            description: "Ingress NGINX controller has been down for more than 1 minute"

        - alert: IngressHighRequestRate
          expr: |
            sum(rate(nginx_ingress_controller_requests[5m])) > 1000
          for: 5m
          labels:
            severity: info
            component: ingress
          annotations:
            summary: "High request rate on ingress controller"
            description: "Ingress is handling {{ $value }} requests/sec"

    # ============================================
    # KUBERNETES CLUSTER ALERTS
    # ============================================
    - name: kubernetes-cluster
      interval: 30s
      rules:
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 2m
          labels:
            severity: critical
            component: cluster
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Kubernetes node {{ $labels.node }} has been in NotReady state for more than 2 minutes"

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="default", deployment=~"(foo|bar)-echo"}
            !=
            kube_deployment_status_replicas_available{namespace="default", deployment=~"(foo|bar)-echo"}
          for: 5m
          labels:
            severity: warning
            component: deployment
          annotations:
            summary: "Deployment {{ $labels.deployment }} has replica mismatch"
            description: "Deployment {{ $labels.deployment }} has {{ $value }} replicas mismatch"
