kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-challenge

# Multi-node cluster: 1 control-plane + 2 workers
nodes:
  # Control plane node with port mappings for ingress
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Map container ports to host for localhost access
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Worker node 1
  - role: worker
    labels:
      workload: http-echo
      node-type: worker

  # Worker node 2
  - role: worker
    labels:
      workload: http-echo
      node-type: worker

# Networking configuration
networking:
  # Pod subnet for cluster networking
  podSubnet: "10.244.0.0/16"
  # Service subnet for ClusterIP services
  serviceSubnet: "10.96.0.0/12"
  # Disable default CNI, will use kindnet
  disableDefaultCNI: false
